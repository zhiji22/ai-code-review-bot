name: review-bot

services:
  # ─────────────────────────────────────────────
  # Reverse Proxy (SSL termination)
  # ─────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

    networks:
      - review_net

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      # HTTPS_PROXY: ${HTTPS_PROXY:-}
      # HTTP_PROXY: ${HTTP_PROXY:-}
      # NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,nginx}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ${GITHUB_APP_KEY_PATH:-./github-app-private-key.pem}:/app/private-key.pem:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "NO_PROXY=localhost,127.0.0.1 HTTP_PROXY='' HTTPS_PROXY='' curl -f http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,nginx}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ${GITHUB_APP_KEY_PATH:-./github-app-private-key.pem}:/app/private-key.pem:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    depends_on:
      redis:
        condition: service_healthy    # 等 redis 真正就绪
      postgres:
        condition: service_healthy    # 等 postgres 真正就绪
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Celery Beat (scheduler)
  # ─────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,nginx}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ${GITHUB_APP_KEY_PATH:-./github-app-private-key.pem}:/app/private-key.pem:ro
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_bot}
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请在 .env 中配置}
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=30
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=4MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=2
      - -c
      - huge_pages=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review} -d ${POSTGRES_DB:-review_bot}"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Redis (cache/queue/rate-limit/idempotency)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 50mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD not set, configure in .env}"
      - --save
      - "60"
      - "1"
      - --save
      - "300"
      - "10"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - review_net

volumes:
  postgres_data:
  redis_data:

networks:
  review_net:
    driver: bridge
