name: review-bot

services:
  # ─────────────────────────────────────────────
  # Reverse Proxy (SSL termination)
  # ─────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - review_net

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${GITHUB_APP_KEY_PATH:-./github-app-private-key.pem}:/app/private-key.pem:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy    # 等 redis 真正就绪
      postgres:
        condition: service_healthy    # 等 postgres 真正就绪
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Celery Beat (scheduler)
  # ─────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Flower (Celery monitoring) — uncomment to enable
  # ─────────────────────────────────────────────
  # flower:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   restart: unless-stopped
  #   env_file: .env
  #   command: celery -A app.tasks.celery_app flower --port=5555
  #     --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD not set}
  #   expose:
  #     - "5555"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - review_net

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_bot}
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请在 .env 中配置}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review} -d ${POSTGRES_DB:-review_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Redis (4 logical DBs: cache/queue/rate-limit/idempotency)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - review_net

  # ─────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────
  # prometheus:
  #   image: prom/prometheus:v3.2.0
  #   restart: unless-stopped
  #   volumes:
  #     - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   expose:
  #     - "9090"
  #   networks:
  #     - review_net

  # ─────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────
  # grafana:
  #   image: grafana/grafana:11.5.0
  #   restart: unless-stopped
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 未设置，请在 .env 中配置}
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   expose:
  #     - "3000"
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - review_net

volumes:
  postgres_data:
  redis_data:

networks:
  review_net:
    driver: bridge
