version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(python):"
    groups:
      fastapi:
        patterns:
          - "fastapi*"
      sqlalchemy:
        patterns:
          - "sqlalchemy*"
          - "alembic*"
      testing:
        patterns:
          - "pytest*"
          - "httpx"
          - "respx"
          - "fakeredis"

  # Frontend dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "deps(frontend):"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      ui:
        patterns:
          - "tailwind*"
          - "lucide-react"
          - "clsx"
          - "tailwind-merge"

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker):"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(ci):"
