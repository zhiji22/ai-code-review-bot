# Deploy to staging/production via SSH on push to main
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"          # 覆盖 index.html / vite.config / tailwind / postcss 等构建配置,不只是 src
      - "docker/**"            # 覆盖 nginx.conf 等容器配置
      - "docker-compose.yml"
      - "Dockerfile.*"
      - "requirements.txt"
      - "pyproject.toml"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment archive
        run: |
          tar czf deploy.tar.gz \
            app/ \
            frontend/src/ \
            frontend/package.json \
            frontend/vite.config.ts \
            frontend/tsconfig.json \
            frontend/tailwind.config.ts \
            frontend/postcss.config.js \
            frontend/index.html \
            docker/ \
            Dockerfile.backend \
            Dockerfile.frontend \
            requirements.txt \
            alembic/ \
            alembic.ini \
            pyproject.toml \
            scripts/ \
            .env.example \
            Dockerfile.backend.dockerignore \
            Dockerfile.frontend.dockerignore \
            docker-entrypoint.sh \
            docker-compose.yml

      - name: Upload to server
        run: |
          scp -i ~/.ssh/deploy_key deploy.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/ai-code-review-bot' }}

            # ─────────────────────────────────────────────
            # CRITICAL: Clean old source files BEFORE extracting
            # This ensures deleted files don't linger and cause
            # Docker cache to incorrectly think nothing changed.
            # ─────────────────────────────────────────────
            rm -rf app/ alembic/ frontend/src/

            # Also clean Python cache that might interfere
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

            # Extract new code (now guaranteed clean state)
            tar xzf /tmp/deploy.tar.gz -C .

            # 清理旧版 cp-based 部署遗留的 .dockerignore。
            # 注意：这只是清理冗余。当存在 Dockerfile.<name>.dockerignore 时，
            # BuildKit 会完全忽略根目录的 .dockerignore（不是合并、不是回退）。
            rm -f .dockerignore

            # 构建 backend 系列服务（backend、worker、beat）。
            # 无需再 cp 切换 .dockerignore：BuildKit 会自动加载与
            # Dockerfile.backend 同名的 Dockerfile.backend.dockerignore。
            #
            # ── 强制 --no-cache（关键修复）──
            # 实测:仅靠 BuildKit 层缓存会出现"部署成功但前端页面仍是旧代码":
            # `COPY frontend/ .` 的缓存键未随源码变化失效 → 构建复用旧 builder
            # 阶段 → `COPY --from=builder /app/dist` 拷出的是旧 dist。
            # --no-cache 强制每层重跑,保证产物由最新源码 build 而成,且生成新
            # 镜像 ID 触发 `up -d` 重建容器。(与 docs/DEPLOYMENT.md 部署说明一致。)
            docker compose build --no-cache backend worker beat

            # 构建 frontend 服务（nginx）— 自动使用 Dockerfile.frontend.dockerignore
            docker compose build --no-cache nginx

            # Pull updated images for services that use `image:` (postgres/redis).
            # `up -d` only pulls when the image is absent, so explicit pull is
            # required to pick up floating-tag updates (e.g. security patches).
            docker compose pull postgres redis

            # Run database migrations
            docker compose run --rm backend alembic upgrade head

            # Restart all services
            docker compose up -d --remove-orphans

            # Backend health check
            sleep 15
            curl -fsS http://localhost:8000/health || exit 1

            # 前端探活:确认 nginx 真的 serve 了带 JS hash 的 index.html。
            # 之前健康检查只查后端 :8000/health,前端旧了/空了也能"绿灯"——
            # 这一步堵住盲区:拿不到有效 hash 就让整个部署失败。
            FRONT_HASH="$(curl -fsS http://localhost/ 2>/dev/null | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1 || true)"
            if [ -z "$FRONT_HASH" ]; then
              echo "ERROR: nginx 未 serve 有效的 index.html(前端构建可能失败)"
              exit 1
            fi
            echo "部署成功,前端入口: $FRONT_HASH"

            # Cleanup
            rm /tmp/deploy.tar.gz
            docker image prune -f
          EOF

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: ${{ secrets.SLACK_CHANNEL || '#deployments' }}
          text: "Deploy failed for ai-code-review-bot (${{ github.event.inputs.environment || 'staging' }})"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key deploy.tar.gz
