# CI pipeline — ruff + mypy + pytest (backend) + lint+build (frontend)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── Backend lint ───────────────────────────
  backend-lint:
    name: Backend · Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports --no-error-summary

  # ─────────────────────────── Backend tests ──────────────────────────
  backend-test:
    name: Backend · Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      APP_SECRET: test-secret-key-for-ci
      GITHUB_TOKEN: ""
      GITHUB_WEBHOOK_SECRET: test-webhook-secret
      OPENAI_API_KEY: sk-test-fake-key
      ENVIRONMENT: test
      SENTRY_DSN: ""

      SECRET_KEY: test-secret-key-for-ci-not-real-32ch
      GITHUB_APP_ID: "123456"
      GITHUB_CLIENT_ID: test-client-id
      GITHUB_CLIENT_SECRET: test-client-secret
      GITHUB_APP_PRIVATE_KEY_PATH: ""
      OPENAI_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_MODEL: qwen-plus
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx respx fakeredis

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review_test
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────── Frontend ───────────────────────────────
  frontend:
    name: Frontend · Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────── Docker build ───────────────────────────
  docker-build:
    name: Docker · Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: ai-code-review-bot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ai-code-review-bot-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── Security scan ──────────────────────────
  security-scan:
    name: Security · Trivy + pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (Python deps)
        # 已修复的低风险直依:python-multipart 0.0.31 / python-dotenv 1.2.2
        # / pyjwt 2.13.0 / cryptography 48.0.1 / python-jose 3.4.0(含原 CI 里
        # 看似"无修复版本"的 PYSEC-2025-183、PYSEC-2025-185——升级后实测已消除)。
        # 以下 9 条暂抑制,均需主版本升级或受传递依赖阻塞,留作专项处理:
        #   - starlette(7 条):FastAPI 0.115.6 只允许 starlette<0.42,修复需把
        #     FastAPI 升到支持 starlette 1.x 的主版本,单独 PR + 全量测试验证。
        #   - pytest CVE-2025-71176:dev 依赖,修复需 pytest 9 主版本(配套升 pytest-asyncio)。
        #   - pyasn1 CVE-2026-30922:python-jose 3.4.0 强制 pyasn1<0.5,无法升级;
        #     python-jose 已停止维护,长期应迁移至 joserfc / pyjwt。
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2025-71176 \
            --ignore-vuln CVE-2026-30922 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2026-48818 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-54283 \
            --ignore-vuln CVE-2026-54282

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
