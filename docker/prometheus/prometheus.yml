global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── FastAPI backend ──
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  # ── Celery Flower ──
  - job_name: "flower"
    static_configs:
      - targets: ["flower:5555"]

  # ── PostgreSQL (needs postgres_exporter sidecar) ──
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # ── Redis ──
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  # ── Prometheus self ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
